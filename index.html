<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>OmniSight</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="menubar">
      <button type="button" class="menu-item" data-menu="options">选项</button>
      <button type="button" class="menu-item" data-menu="settings">设置</button>
      <button type="button" class="menu-item" data-menu="help">帮助</button>
    </div>
    <div id="menu-dropdown" hidden></div>
    <div id="topbar">
      <div class="year-switcher">
        <button id="prev-year" class="btn" title="上一年">◀</button>
        <span id="year-label">2026</span>
        <button id="next-year" class="btn" title="下一年">▶</button>
      </div>
      <div class="action-buttons">
        <button id="add-btn" class="btn primary" disabled>添加</button>
        <button id="new-item-btn" class="btn">新建事项</button>
        <button id="batch-delete-btn" class="btn">批量删除</button>
      </div>
      <div class="action-buttons" id="batch-actions" hidden>
        <button id="batch-done-btn" class="btn">完成</button>
        <button id="batch-cancel-btn" class="btn">取消</button>
      </div>
      <div class="topbar-spacer"></div>
      <div id="stamp-pad" class="stamp-pad"><span>印台</span></div>
      <div class="app-brand">
        <div id="app-title" class="app-title">OmniSight · 线性日历</div>
        <div class="app-subtitle">by Aydin</div>
      </div>
    </div>
    <div id="main">
      <div id="scroll-body"></div>
    </div>
    <div id="statusbar">
      <span id="statusbar-hint" class="statusbar-hint">拖拽可绘制事项；Ctrl+单击多选；Esc 取消草稿；双击编辑；右键删除。</span>
      <span id="data-dir" class="data-dir"></span>
    </div>
  </div>
  <script src="renderer/i18n.js"></script>
  <script src="renderer/date-utils.js"></script>
  <script src="renderer/store.js"></script>
  <script src="renderer/render.js"></script>
  <script src="renderer/dialogs.js"></script>
  <script src="renderer/interactions.js"></script>
  <script src="renderer/app.js"></script>
</body>
</html>
